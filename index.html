<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Expense Tracker</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">

        <h1>Expense Tracker</h1>

        <!-- Balance -->
        <div class="balance-container">
            <h3>Your Balance</h3>
            <h2 id="balance">₹0</h2>
        </div>

        <!-- Income & Expense -->
        <div class="summary">

            <div class="income-box">
                <h4>Income</h4>
                <p id="income">₹0</p>
            </div>

            <div class="expense-box">
                <h4>Expense</h4>
                <p id="expense">₹0</p>
            </div>

        </div>

        <!-- Form -->
        <div class="form-container">

            <h3>Add Transaction</h3>

            <form id="transaction-form">

                <input 
                    type="text"
                    id="text"
                    placeholder="Enter title"
                    required
                >

                <input 
                    type="number"
                    id="amount"
                    placeholder="Enter amount (+income, -expense)"
                    required
                >

                <button type="submit">
                    Add Transaction
                </button>

            </form>

        </div>

        <!-- Transaction History -->
        <div class="history">

            <h3>History</h3>

            <ul id="list"></ul>

        </div>

    </div>

    <script src="script.js"></script>
</body>
</html>
